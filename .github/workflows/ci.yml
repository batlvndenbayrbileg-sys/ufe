name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Placeholder for the lesson-shell bundlesize gate (T0.2 AC).
  # Wired for real once the /learn shell exists in E7; must fail when the
  # Tier-1 lesson shell exceeds 400 KB gzipped (see 11-system-architecture.md §11.7).
  bundlesize:
    name: bundlesize (lesson shell ≤ 400 KB gz)
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - run: echo "enabled in E7"
