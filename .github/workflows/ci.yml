name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"
  DATABASE_URL: "postgresql://khiye:khiye@localhost:5432/khiye?schema=public"

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: khiye
          POSTGRES_PASSWORD: khiye
          POSTGRES_DB: khiye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khiye -d khiye"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @khiye/db exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @khiye/db exec prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @khiye/db db:seed

      - name: Sync course content into the database
        run: pnpm --filter @khiye/content-sdk content sync ../../content/courses/internet-programming

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (incl. DB integration)
        run: pnpm test

      - name: Build
        run: pnpm build

  content:
    name: content (lint · solutions · starters)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails unless, for every task: the reference solution passes its checks,
      # the starter fails at least one, the starter renders without crashing,
      # and the solution runs without console errors. Plus the workspace lint
      # (missing target file, marker not in that file, unknown skill, …).
      - name: Content
        run: pnpm --filter @khiye/content-sdk content test ../../content/courses/internet-programming

  # The lesson shell is what a student on a Mongolian mobile connection waits
  # for before they can type. 400 KB gz, from 11-system-architecture.md §11.7.
  bundlesize:
    name: bundlesize (lesson shell ≤ 400 KB gz)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @khiye/web build

      - name: Measure
        run: pnpm --filter @khiye/web exec node scripts/bundlesize.mjs
